name: Validate Packer template

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'renovate.json'

permissions:
  contents: write

jobs:
  validate:
    name: Validate Packer template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check clone-safe iSCSI image preparation
        run: |
          docker run --rm -v "$PWD:/workspace:ro" \
            python:3.14-slim-trixie@sha256:caaf356f40667c496d405780745b9ac25771c189a51dfcc42430d531ea09f8a2 \
            bash /workspace/scripts/tests/test-iscsi-template.sh

      - name: Install Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: latest

      - name: Validate
        env:
          # Make sure that validate does not fail due to unset variables
          PKR_VAR_proxmox_api_url: 'https://proxmox.example.com:8006/api2/json'
          PKR_VAR_proxmox_api_token_id: 'id'
          PKR_VAR_proxmox_api_token_secret: 'secret'
        run: |
          packer init -force -upgrade .

          echo "### 📦 Packer Validation Results" >> $GITHUB_STEP_SUMMARY
          
          set +e
          OUTPUT=$(packer validate . 2>&1)
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ **Syntax Valid**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Syntax Invalid**" >> $GITHUB_STEP_SUMMARY
            echo '```term' >> $GITHUB_STEP_SUMMARY
            echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
