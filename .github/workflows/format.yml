name: Format

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  format:
    name: Format Packer, YAML, JSON and shell files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.ORG_DISPATCH_TOKEN }}

      - name: Install Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: latest

      - name: Run Packer fmt command
        run: packer fmt -recursive .

      - name: Prettier
        uses: creyD/prettier_action@v4.6
        with:
          prettier_options: --write **/*.{yaml,yml,json}
          no_commit: true

      # Pinned to match .pre-commit-config.yaml. Resolving "latest" also makes
      # the action fetch a redirect from github.com with no error handler, so a
      # dropped connection crashes the job.
      - name: Setup shfmt
        uses: mfinelli/setup-shfmt@v4.0.1
        with:
          shfmt-version: 3.13.1

      - name: Run shfmt
        run: shfmt -i 2 -ci -s -w **/*.sh || true

      - name: Run shellcheck
        run: shellcheck scripts/*.sh

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: "style: apply automatic formatting"
