name: Build Proxmox template

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'renovate.json'
  workflow_dispatch:

permissions:
  contents: write

# Every build replaces its template at a fixed VMID (-force): never run two at once.
concurrency:
  group: packer-build
  cancel-in-progress: false

jobs:
  base:
    name: Packer build (base)
    runs-on: self-hosted
    container:
      image: hashicorp/packer:light
      ports:
        - 8000:8000 # Preseed HTTP server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build base template
        env:
          PKR_VAR_runner_host_ip: ${{ secrets.PACKER_RUNNER_HOST_IP }}
          PKR_VAR_proxmox_api_url: ${{ vars.PROXMOX_API_URL }}
          PKR_VAR_proxmox_api_token_id: ${{ secrets.PROXMOX_API_TOKEN_ID }}
          PKR_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
          PKR_VAR_insecure_skip_tls_verify: ${{ vars.INSECURE_SKIP_TLS_VERIFY }}
          PKR_VAR_timezone: ${{ vars.TIMEZONE }}
          PKR_VAR_apt_mirror: |
            {
              "protocol": "${{ vars.APT_MIRROR_PROTOCOL }}",
              "country": "${{ vars.APT_MIRROR_COUNTRY }}",
              "hostname": "${{ vars.APT_MIRROR_HOSTNAME }}",
              "directory": "${{ vars.APT_MIRROR_DIRECTORY }}"
            }
        run: |
          packer init -force -upgrade .
          packer build -force -only='proxmox-iso.base' .

  k3s:
    name: Packer build (k3s)
    runs-on: self-hosted
    needs: base
    container:
      image: hashicorp/packer:light
    outputs:
      manifest: ${{ steps.get-manifest.outputs.file }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build k3s template
        env:
          PKR_VAR_proxmox_api_url: ${{ vars.PROXMOX_API_URL }}
          PKR_VAR_proxmox_api_token_id: ${{ secrets.PROXMOX_API_TOKEN_ID }}
          PKR_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
          PKR_VAR_insecure_skip_tls_verify: ${{ vars.INSECURE_SKIP_TLS_VERIFY }}
        run: |
          packer init -force -upgrade .
          packer build -force -only='proxmox-clone.k3s' .

      - name: Get Packer build manifest
        id: get-manifest
        run: |
          echo 'file<<EOF' >> $GITHUB_OUTPUT
          cat packer-manifest.json >> $GITHUB_OUTPUT
          echo -e '\nEOF' >> $GITHUB_OUTPUT

  storage:
    name: Packer build (storage)
    runs-on: self-hosted
    needs: base
    container:
      image: hashicorp/packer:light
    outputs:
      manifest: ${{ steps.get-manifest.outputs.file }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build storage template
        env:
          PKR_VAR_proxmox_api_url: ${{ vars.PROXMOX_API_URL }}
          PKR_VAR_proxmox_api_token_id: ${{ secrets.PROXMOX_API_TOKEN_ID }}
          PKR_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
          PKR_VAR_insecure_skip_tls_verify: ${{ vars.INSECURE_SKIP_TLS_VERIFY }}
        run: |
          packer init -force -upgrade .
          packer build -force -only='proxmox-clone.storage' .

      - name: Get Packer build manifest
        id: get-manifest
        run: |
          echo 'file<<EOF' >> $GITHUB_OUTPUT
          cat packer-manifest.json >> $GITHUB_OUTPUT
          echo -e '\nEOF' >> $GITHUB_OUTPUT

  create-release:
    name: Create release
    runs-on: ubuntu-latest
    needs: k3s
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - run: echo -e ${{ toJSON(needs.k3s.outputs.manifest) }} > manifest.json

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fails when the k3s entry is missing.
          GIT_TAG="$(jq -er '[.builds[] | select(.name=="k3s")] | last | .custom_data.git_tag' manifest.json)"
          gh release create "$GIT_TAG" \
            --generate-notes \
            --latest \
            manifest.json

  push-manifest:
    name: Push manifest to terraform repo
    runs-on: ubuntu-latest
    needs: [k3s, storage]
    # Runs when either build succeeded; a failed build keeps its old entry in terraform's manifest.
    if: ${{ !cancelled() && contains(needs.*.result, 'success') }}
    steps:
      - name: Checkout Terraform repository
        uses: actions/checkout@v7
        with:
          repository: Starktastic-Homelab/terraform
          token: ${{ secrets.ORG_DISPATCH_TOKEN }}

      # After the terraform checkout, which cleans the workspace; only packer-manifest.json is committed.
      - name: Checkout packer repository
        uses: actions/checkout@v7
        with:
          path: packer

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_DISPATCH_TOKEN }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          git config user.name "GitHub Actions (Packer)"
          git config user.email "actions.packer@github.com"

          # Checkout branch
          BRANCH_NAME=packer-build-${{ github.run_number }}
          git checkout -b $BRANCH_NAME

          # Merge every successful build's entry by name, keeping the other templates' entries.
          printf '%s' "$NEEDS" > "$RUNNER_TEMP/needs.json"
          bash packer/scripts/merge-manifest.sh "$RUNNER_TEMP/needs.json" packer-manifest.json > "$RUNNER_TEMP/merged.json"
          mv "$RUNNER_TEMP/merged.json" packer-manifest.json
          VM_NAMES="$(jq -r --slurpfile needs "$RUNNER_TEMP/needs.json" '[.builds[] | select(.name as $n | $needs[0][$n].result == "success") | .custom_data.vm_name] | join(", ")' packer-manifest.json)"

          # Commit and push
          git add packer-manifest.json
          git commit -m "Update Packer manifest file - ${{ github.run_number }}"
          git push -u origin $BRANCH_NAME

          # Create PR
          gh pr create \
            --base main \
            --head $BRANCH_NAME \
            --title "Update VM templates ($VM_NAMES)" \
            --body "This PR updates the Packer manifest file entries of the templates this build made with the latest build information."
