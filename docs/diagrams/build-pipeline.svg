      .edge, .flow { stroke: #2563EB; }
      .head { fill: #2563EB; }
      .badge { fill: #FFFFFF; stroke: #2563EB; }
      .badget { fill: #1E3A8A; }
      .side { stroke: #7C3AED; }
      .sidehead { fill: #7C3AED; }
      .pill { fill: #F5F3FF; stroke: #7C3AED; stroke-opacity: .45; }
      .pillt { fill: #5B21B6; }
      .wire { stroke: #64709A; }
      .wirehead { fill: #64709A; }
      .hum { fill: #FFFBEB; stroke: #D97706; stroke-opacity: .6; }
      .humt { fill: #92400E; }
