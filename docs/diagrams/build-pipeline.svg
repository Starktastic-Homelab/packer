  <circle class="badge" cx="62" cy="266" r="12"/><text class="badget" x="62" y="270.5" font-size="13" font-weight="800" text-anchor="middle">2</text>
  <circle class="badge" cx="62" cy="330" r="12"/><text class="badget" x="62" y="334.5" font-size="13" font-weight="800" text-anchor="middle">3</text>
  <circle class="badge" cx="62" cy="452" r="12"/><text class="badget" x="62" y="456.5" font-size="13" font-weight="800" text-anchor="middle">4</text>
  <circle class="badge" cx="62" cy="516" r="12"/><text class="badget" x="62" y="520.5" font-size="13" font-weight="800" text-anchor="middle">5</text>

  <rect class="wf" x="86" y="188" width="262" height="28" rx="8"/><text class="wft mono" x="96" y="206.55" font-size="13">proxmox-iso.debian-13</text>
  <rect class="wf" x="86" y="252" width="262" height="28" rx="8"/><text class="wft mono" x="96" y="270.55" font-size="13">http/preseed.cfg.tmpl</text>
  <rect class="wf" x="86" y="316" width="262" height="28" rx="8"/><text class="wft mono" x="96" y="334.55" font-size="13">scripts/bootstrap.sh</text>
  <rect class="wf" x="86" y="438" width="262" height="28" rx="8"/><text class="wft mono" x="96" y="456.55" font-size="13">cloud-init/</text>
  <rect class="wf" x="86" y="502" width="262" height="28" rx="8"/><text class="wft mono" x="96" y="520.55" font-size="13">scripts/delete_builder_user.sh</text>

  <g class="t1" font-size="15" font-weight="700">
    <text x="366" y="198">Boot the installer in a new VM on Proxmox</text>
    <text x="366" y="262">Install Debian unattended</text>
    <text x="366" y="335">Upgrade, install the guest GPU driver, reset the identity</text>
    <text x="366" y="448">Add the cloud-init configuration</text>
    <text x="366" y="512">Remove the builder user</text>
  </g>
  <g class="t2" font-size="13">
    <text x="366" y="217">Debian 13 netinst ISO, checksum from Debian's SHA256SUMS; q35, virtio disk and NIC</text>
    <text x="366" y="281">answers served over HTTP on port 8000; root login off, a temporary builder user for SSH</text>
    <text x="366" y="467">copied to /etc/cloud: NoCloud and ConfigDrive datasources, root login disabled</text>
    <text x="366" y="531">deletes the account Packer logged in with, and its sudoers file</text>
  </g>

  <!-- inside bootstrap.sh -->
  <path class="wire" d="M100 346V370Q100 376 106 376H110"/><path class="wirehead" d="M119 376l-8 -4.5v9.0z"/>
  <rect class="chip" x="120" y="363" width="150" height="26" rx="13"/><text class="chipt" x="195" y="380.68" font-size="13" text-anchor="middle">kernel-series gate</text>
  <path class="wire" d="M272 376H288"/><path class="wirehead" d="M297 376l-8 -4.5v9.0z"/>
  <rect class="tag" x="298" y="363" width="112" height="26" rx="13"/><text class="tagt" x="354" y="380.68" font-size="13" text-anchor="middle">DKMS install</text>
  <path class="wire" d="M412 376H428"/><path class="wirehead" d="M437 376l-8 -4.5v9.0z"/>
  <rect class="chip" x="438" y="363" width="140" height="26" rx="13"/><text class="chipt" x="508" y="380.68" font-size="13" text-anchor="middle">DKMS status gate</text>
  <path class="wire" d="M580 376H596"/><path class="wirehead" d="M605 376l-8 -4.5v9.0z"/>
  <rect class="tag" x="606" y="363" width="82" height="26" rx="13"/><text class="tagt" x="647" y="380.68" font-size="13" text-anchor="middle">netplan</text>
  <path class="wire" d="M690 376H706"/><path class="wirehead" d="M715 376l-8 -4.5v9.0z"/>
  <rect class="tag" x="716" y="363" width="120" height="26" rx="13"/><text class="tagt" x="776" y="380.68" font-size="13" text-anchor="middle">GRUB cmdline</text>
  <path class="wire" d="M838 376H854"/><path class="wirehead" d="M863 376l-8 -4.5v9.0z"/>
  <rect class="tag" x="864" y="363" width="140" height="26" rx="13"/><text class="tagt" x="934" y="380.68" font-size="13" text-anchor="middle">machine-id reset</text>
  <text class="t3" x="120" y="408" font-size="12.5">A kernel outside the pinned series, or a driver that DKMS did not install for the boot kernel, fails the build.</text>

  <!-- result -->
  <rect class="chip" x="46" y="569" width="170" height="34" rx="10"/><text class="chipt" x="131" y="591.04" font-size="14" font-weight="700" text-anchor="middle">Template VM 900</text>
  <path class="edge" d="M218 586H288"/><path class="flow" d="M218 586H288"/><path class="head" d="M297 586l-10 -5.5v11.0z"/>
  <rect class="wf" x="298" y="572" width="222" height="28" rx="8"/><text class="wft mono" x="308" y="590.55" font-size="13">post-processor "manifest"</text>
  <text class="t2" x="534" y="590.5" font-size="13">records vm_name, git_tag, the i915 release and its kernel series</text>

  <!-- fan-out -->
  <path class="edge" d="M409 602V662Q409 668 403 668H127Q121 668 121 674V680"/><path class="flow" d="M409 602V662Q409 668 403 668H127Q121 668 121 674V680"/><path class="head" d="M121 689l-5.5 -10h11.0z"/>
  <path class="edge" d="M409 668H511Q517 668 517 674V680"/><path class="flow" d="M409 668H511Q517 668 517 674V680"/><path class="head" d="M517 689l-5.5 -10h11.0z"/>
  <rect class="pill" x="309" y="628" width="200" height="28" rx="14"/><text class="pillt mono" x="409" y="646.86" font-size="13.5" text-anchor="middle">packer-manifest.json</text>

  <rect class="card" x="30" y="690" width="356" height="96" rx="20"/><rect class="rim" x="30.5" y="690.5" width="355" height="95" rx="19.5"/>
  <rect class="wf" x="46" y="706" width="150" height="28" rx="8"/><text class="wft mono" x="56" y="724.55" font-size="13">create-release</text>
  <path class="edge" d="M198 720H218"/><path class="flow" d="M198 720H218"/><path class="head" d="M227 720l-10 -5.5v11.0z"/>
  <rect class="chip" x="228" y="703" width="142" height="34" rx="10"/><text class="chipt" x="299" y="725.04" font-size="14" font-weight="700" text-anchor="middle">GitHub release</text>
  <g class="t2" font-size="12.5">
    <text x="46" y="758">tagged with git_tag and marked latest,</text>
    <text x="46" y="775">with the manifest attached</text>
  </g>

  <rect class="card" x="422" y="690" width="648" height="96" rx="20"/><rect class="rim" x="422.5" y="690.5" width="647" height="95" rx="19.5"/>
  <rect class="wf" x="438" y="706" width="158" height="28" rx="8"/><text class="wft mono" x="448" y="724.55" font-size="13">push-manifest</text>
  <path class="edge" d="M598 720H622"/><path class="flow" d="M598 720H622"/><path class="head" d="M631 720l-10 -5.5v11.0z"/>
  <rect class="tile" x="632" y="700" width="40" height="40" rx="12"/><use href="#i-terraform" x="640" y="708" width="24" height="24"/>
  <text class="t1 mono" x="682" y="717" font-size="14">packer-build-&lt;run&gt;</text>
  <text class="t2" x="682" y="734" font-size="12.5">pull request in terraform</text>
  <path class="gate" d="M842 720H876"/>
  <rect class="hum" x="878" y="706" width="168" height="28" rx="14"/><text class="humt" x="962" y="724.68" font-size="13" text-anchor="middle">a person merges it</text>
  <g class="t2" font-size="12.5">
    <text x="438" y="758">commits packer-manifest.json to a new branch in Starktastic-Homelab/terraform;</text>
    <text x="438" y="775">nothing downstream runs until the pull request is merged</text>
  </g>

  <text class="t3" x="40" y="814" font-size="12.5">Only packer-build uses the self-hosted runner. create-release and push-manifest run in parallel once it finishes.</text>
</svg>
