  <text class="acc" x="40" y="52" font-size="14" font-weight="700" letter-spacing="3">BUILD PIPELINE</text>
  <text class="t1" x="40" y="86" font-size="26" font-weight="800">Bake the template, ship the manifest</text>
  <g class="t2" font-size="13.5">
    <path class="edge" d="M700 48H744"/><path class="flow" d="M700 48H744"/>
    <text x="754" y="52.5">next step</text>
    <path class="gate" d="M700 76H744"/>
    <text x="754" y="80.5">manual step</text>
    <circle class="dot" cx="852" cy="48" r="4"/>
    <text x="864" y="52.5">uses the self-hosted runner</text>
  </g>

  <!-- job 1: packer-build -->
  <rect class="lane" x="30" y="112" width="1040" height="510" rx="20"/><rect class="rim" x="30.5" y="112.5" width="1039" height="509" rx="19.5"/>
  <rect class="wf" x="46" y="126" width="150" height="28" rx="8"/><text class="wft mono" x="56" y="144.55" font-size="13">packer-build</text><circle class="dot" cx="184" cy="140" r="3.5"/>
  <text class="t2" x="210" y="144.5" font-size="13.5">first job of <tspan class="t1 mono" font-size="13">build.yml</tspan>, runs <tspan class="t1 mono" font-size="13">packer build -force</tspan> in the <tspan class="t1 mono" font-size="13">hashicorp/packer:light</tspan> container</text>
  <path class="rule" d="M46 168H1054"/>

  <!-- spine -->
  <path class="edge" d="M62 214V254M62 278V318M62 342V440M62 464V504M62 528V558"/><path class="flow" d="M62 214V254M62 278V318M62 342V440M62 464V504M62 528V558"/><path class="head" d="M62 568l-5.5 -10h11.0z"/>
