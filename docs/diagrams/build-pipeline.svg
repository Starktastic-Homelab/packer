<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="836" viewBox="0 0 1100 836" role="img" aria-labelledby="t d">
  <title id="t">Build pipeline: from the Debian installer to a pull request in terraform</title>
  <desc id="d">The packer-build job of build.yml runs packer build on the self-hosted runner. Five steps follow each other: the proxmox-iso.debian-13 source boots the Debian 13 netinst ISO in a new VM on Proxmox; http/preseed.cfg.tmpl, served over HTTP on port 8000, installs Debian unattended; scripts/bootstrap.sh upgrades the system and runs a kernel-series gate, the DKMS driver install, a DKMS status gate, the move to netplan, the GRUB command line and a machine-id reset; the cloud-init directory is copied to /etc/cloud; scripts/delete_builder_user.sh removes the builder user. The result is template VM 900. The manifest post-processor writes packer-manifest.json, which two parallel jobs consume: create-release publishes a GitHub release, and push-manifest opens the pull request packer-build-run in terraform, which a person merges.</desc>
  <defs>
    <radialGradient id="ga"><stop offset="0" stop-color="#3B82F6" stop-opacity=".55"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
