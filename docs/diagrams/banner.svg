  </defs>
  <style>
    text { font-family: Manrope, Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans', Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .panel { fill: #0B0C16; }
    .card { fill: url(#card); fill-opacity: .8; }
    .rim { fill: none; stroke: url(#rim); }
    .lit { fill: none; stroke: #60A5FA; stroke-width: 2; }
    .lane { fill: #FFFFFF; fill-opacity: .035; stroke: #FFFFFF; stroke-opacity: .09; }
    .tile { fill: #262A52; }
    .t1 { fill: #F5F7FF; }
    .t2 { fill: #AEB9D6; }
    .t3 { fill: #7F8AAB; }
    .acc { fill: #93C5FD; }
    .vio { fill: #C4B5FD; }
    .amb { fill: #FCD34D; }
    .rule { stroke: #FFFFFF; stroke-opacity: .1; }
    .chip { fill: #3B82F6; fill-opacity: .16; stroke: #60A5FA; stroke-opacity: .45; }
    .chipt { fill: #DBEAFE; }
    .wf { fill: #FFFFFF; fill-opacity: .06; stroke: #FFFFFF; stroke-opacity: .2; }
