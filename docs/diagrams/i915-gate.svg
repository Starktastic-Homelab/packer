  <text class="acc" x="40" y="52" font-size="14" font-weight="700" letter-spacing="3">I915 COMPATIBILITY GATE</text>
  <text class="t1" x="40" y="86" font-size="26" font-weight="800">Three checks, and unknown means fail</text>
  <g class="t2" font-size="13.5">
    <path class="edge" d="M836 48H880"/><path class="flow" d="M836 48H880"/>
    <text x="890" y="52.5">next step</text>
