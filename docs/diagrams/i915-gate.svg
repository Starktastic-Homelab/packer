<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="706" viewBox="0 0 1100 706" role="img" aria-labelledby="t d">
  <title id="t">i915 compatibility gate: two driver pins, one checker, one required check</title>
  <desc id="d">The i915-compat.yml workflow runs on every pull request to main. It reads the guest pin, i915_sriov_version and i915_sriov_kernel_series, from debian.auto.pkrvars.hcl in the pull request, and the host pin, i915_sriov_version and i915_sriov_pinned_kernel, from the main branch of the ansible repository. scripts/i915_compat.py first rejects host releases on its BLOCKED_HOST_RELEASES list, then makes three checks with data from the upstream strongtz/i915-sriov-dkms repository: the guest driver supports the guest kernel, the host driver supports the host kernel, and the two drivers can negotiate a common PF/VF IOV ABI. The report is posted as a sticky pull request comment, and the required status check Validate i915 metadata and policy passes only on exit code 0. Exit code 1 means unsupported or blocked. Exit code 2 means the metadata could not be established, so unknown fails closed.</desc>
  <defs>
    <radialGradient id="ga"><stop offset="0" stop-color="#3B82F6" stop-opacity=".55"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
