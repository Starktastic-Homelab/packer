  <rect class="wf" x="46" y="236" width="238" height="24" rx="8"/><text class="wft mono" x="56" y="252.55" font-size="13">i915_sriov_version</text>
  <rect class="wf" x="46" y="264" width="238" height="24" rx="8"/><text class="wft mono" x="56" y="280.55" font-size="13">i915_sriov_kernel_series</text>

