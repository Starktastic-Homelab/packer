  <text class="t2" x="418" y="223" font-size="13">the same file, byte for byte, as in ansible</text>
  <path class="rule" d="M366 242H734"/>

  <rect class="wf" x="366" y="254" width="190" height="26" rx="8"/><text class="wft mono" x="376" y="271.55" font-size="13">BLOCKED_HOST_RELEASES</text>
  <rect class="tag" x="566" y="256" width="104" height="22" rx="11"/><text class="tagt" x="618" y="271.5" font-size="12.5" text-anchor="middle">checked first</text>
  <text class="t2" x="366" y="299" font-size="13">known-bad host releases, rejected before any lookup</text>
  <path class="rule" d="M366 312H734"/>

  <circle class="badge" cx="378" cy="336" r="11"/><text class="badget" x="378" y="340.5" font-size="13" font-weight="800" text-anchor="middle">1</text>
  <circle class="badge" cx="378" cy="378" r="11"/><text class="badget" x="378" y="382.5" font-size="13" font-weight="800" text-anchor="middle">2</text>
  <circle class="badge" cx="378" cy="420" r="11"/><text class="badget" x="378" y="424.5" font-size="13" font-weight="800" text-anchor="middle">3</text>
  <g class="t1" font-size="14" font-weight="700">
    <text x="400" y="333">guest driver supports the guest kernel</text>
    <text x="400" y="375">host driver supports the host kernel</text>
    <text x="400" y="417">PF and VF agree on an IOV ABI</text>
  </g>
  <g class="t2" font-size="12.5">
    <text x="400" y="350">kernel range in the release notes of the exact tag</text>
    <text x="400" y="392">same check, against the pinned Proxmox kernel</text>
    <text x="400" y="434">iov_version_abi.h of both tags, handshake replayed</text>
  </g>

  <!-- upstream data -->
  <rect class="wf" x="350" y="484" width="400" height="40" rx="10"/><rect class="tile" x="355" y="489" width="30" height="30" rx="8"/><text class="acc" x="370" y="507.8" font-size="10" font-weight="800" text-anchor="middle">GH</text><text class="wft" x="393" y="508.86" font-size="13.5">strongtz/i915-sriov-dkms</text>
  <text class="t2" x="738" y="509" font-size="12.5" text-anchor="end">upstream, by exact tag</text>
  <path class="side" d="M550 482V458"/><path class="sidehead" d="M550 449l-5 9h10z"/>

  <!-- outputs -->
  <path class="edge" d="M752 234H790"/><path class="flow" d="M752 234H790"/><path class="head" d="M799 234l-10 -5.5v11.0z"/>
  <rect class="card" x="800" y="172" width="270" height="124" rx="20"/><rect class="rim" x="800.5" y="172.5" width="269" height="123" rx="19.5"/>
  <rect class="tile" x="816" y="188" width="40" height="40" rx="12"/><text class="acc" x="836" y="211.8" font-size="10" font-weight="800" text-anchor="middle">PR</text>
  <text class="t1" x="868" y="205" font-size="16" font-weight="800">Sticky PR comment</text>
  <text class="t2 mono" x="868" y="223" font-size="12.5">i915-driver-check</text>
  <g class="t2" font-size="13">
    <text x="816" y="258">the report, posted before the job</text>
    <text x="816" y="276">fails, so a rejection explains itself</text>
  </g>

  <path class="edge" d="M935 298V314"/><path class="flow" d="M935 298V314"/><path class="head" d="M935 323l-5.5 -10h11.0z"/>
  <rect class="card" x="800" y="324" width="270" height="124" rx="20"/><rect class="rim" x="800.5" y="324.5" width="269" height="123" rx="19.5"/>
  <text class="acc" x="816" y="350" font-size="12.5" font-weight="700" letter-spacing="1.5">REQUIRED STATUS CHECK</text>
  <text class="t1" x="816" y="376" font-size="15" font-weight="800">Validate i915 metadata</text>
  <text class="t1" x="816" y="395" font-size="15" font-weight="800">and policy</text>
  <text class="t2" x="816" y="424" font-size="13">passes only on exit 0</text>

  <!-- exit codes -->
  <rect class="lane" x="30" y="566" width="1040" height="92" rx="14"/><rect class="rim" x="30.5" y="566.5" width="1039" height="91" rx="13.5"/>
  <rect class="tag" x="46" y="577" width="72" height="26" rx="13"/><text class="tagt mono" x="82" y="594.68" font-size="13" text-anchor="middle">exit 0</text>
  <rect class="tag" x="394" y="577" width="72" height="26" rx="13"/><text class="tagt mono" x="430" y="594.68" font-size="13" text-anchor="middle">exit 1</text>
  <rect class="tag" x="742" y="577" width="72" height="26" rx="13"/><text class="tagt mono" x="778" y="594.68" font-size="13" text-anchor="middle">exit 2</text>
  <g class="t1" font-size="14" font-weight="700">
    <text x="130" y="594.5">Passed</text>
    <text x="478" y="594.5">Unsupported or blocked</text>
    <text x="826" y="594.5">Cannot be established</text>
  </g>
  <g class="t2" font-size="13">
    <text x="46" y="622">upstream metadata and local policy agree;</text>
    <text x="46" y="640">the hardware is still not tested</text>
    <text x="394" y="622">a kernel outside the range, no common ABI,</text>
    <text x="394" y="640">or a blocked host release</text>
    <text x="742" y="622">missing tag, unparsable notes or network</text>
    <text x="742" y="640">failure: unknown fails closed</text>
  </g>

  <text class="t3" x="40" y="684" font-size="12.5">ansible runs the same checker on its own pull requests and reads the guest pin from this repository's main branch.</text>
</svg>
