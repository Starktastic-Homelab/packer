  <!-- the checker -->
  <rect class="card" x="350" y="172" width="400" height="276" rx="20"/><rect class="lit" x="350.5" y="172.5" width="399" height="275" rx="19.5"/>
  <rect class="tile" x="366" y="188" width="40" height="40" rx="12"/><text class="acc" x="386" y="211.8" font-size="10" font-weight="800" text-anchor="middle">PY</text>
